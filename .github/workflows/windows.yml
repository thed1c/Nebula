name: windows

# Nebula on Windows (design decision 2026-10-20: one-click install on Windows and Linux). The whole unit suite on a Windows
# runner; run by hand, or on a push to a branch that works on Windows. Kept apart from "tests" while the port lands.
on:
  workflow_dispatch:                    # by hand only: Windows minutes bill double

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[monitor]"
      - name: Unit tests
        run: python -m unittest discover -s nebula/tests -t . -v
