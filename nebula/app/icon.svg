<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Nebula EH: the edge of a black hole, close up, with Halo. The horizon fills the lower right and its rim burns
       brightest where the disk swings toward you. Halo's stream, drawn as the app draws it: its fibres reach for Halo's bubble
       like an outstretched hand (fingertips bright, not yet touching), run back from its right side and wrap clockwise round the hole into its rim. -->
