    <radialGradient id="h-pearl" cx="38%" cy="32%" r="68%"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#f7f4ff"/><stop offset=".62" stop-color="#e4e0f2"/><stop offset="1" stop-color="#b9b4cc"/></radialGradient>
    <linearGradient id="h-sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd6f0"/><stop offset=".33" stop-color="#d6e9ff"/><stop offset=".66" stop-color="#d8ffe9"/><stop offset="1" stop-color="#fff2c9"/></linearGradient>
